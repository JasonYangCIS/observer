[build]
command = "NITRO_PRESET=netlify pnpm build && if [ \"${CONTEXT:-}\" = \"production\" ]; then DATABASE_URL=\"${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL to the Supabase direct/session URL}\" pnpm migrate:production; fi"
publish = "dist"
# Skip builds that cannot change the deployed app (docs, tests, CI). See scripts/netlify-ignore.sh.
ignore = "bash scripts/netlify-ignore.sh"
functions = ".netlify/functions-internal"

[build.environment]
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"

[context.production.environment]
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"
